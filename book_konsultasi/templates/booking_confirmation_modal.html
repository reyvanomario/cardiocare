<!-- Booking Confirmation Modal -->
<div id="bookingConfirmationModal" class="modal">
    <div class="modal-content">
        <button type="button" class="btn-close" onclick="closeConfirmationModal()">&times;</button>
        <div class="modal-header">Konfirmasi Booking</div>
        <div class="modal-body">
            <p>Anda akan melakukan booking untuk:</p>
            <div class="confirmation-details">
                <p><strong>Dokter:</strong> <span id="confirm-dokter-name"></span></p>
                <p><strong>Jadwal:</strong> <span id="confirm-dokter-jadwal"></span></p>
                <p><strong>Rumah Sakit:</strong> <span id="confirm-rumah-sakit"></span></p>
            </div>
            <p>Apakah Anda yakin ingin melanjutkan?</p>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="closeConfirmationModal()">Batal</button>
            <button type="button" class="btn btn-primary" id="confirm-booking-btn">Konfirmasi</button>
        </div>
    </div>
</div>

<style>
    /* Confirmation Modal Styling */
    .confirmation-details {
        background-color: #f9f9f9;
        padding: 1rem;
        border-radius: 8px;
        margin: 1rem 0;
    }

    .confirmation-details p {
        margin-bottom: 0.5rem;
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');
        
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                loginError.textContent = 'Username dan password wajib diisi!';
                loginError.style.display = 'block';
                return;
            }
            
            fetch('/api/login/', { 
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                },
                body: JSON.stringify({ 
                    username: username,
                    password: password
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success && data.require_otp) {
                    document.getElementById('loginModal').classList.remove('active');
                    document.getElementById('otpModal').classList.add('active');
                    document.getElementById('userEmailHidden').value = username.includes('@') ? username : '';
                    document.getElementById('usernameHidden').value = username;
                    document.getElementById('passwordHidden').value = password;
                    document.querySelector('.user-email-display').textContent = username;
                    document.querySelector('.otp-input').focus();
                    startOtpTimer();
                } else if (data.success) {
                    if (data.redirect_url) {
                        window.location.href = data.redirect_url;
                    } else {
                        window.location.reload();
                    }
                } else {
                    loginError.textContent = data.error || data.message || 'Username atau password salah.';
                    loginError.style.display = 'block';
                    
                    if (data.remaining_attempts !== undefined) {
                        loginError.textContent += ` Percobaan tersisa: ${data.remaining_attempts}`;
                    }
                }
            })
            .catch(error => {
                console.error('Error:', error);
                loginError.textContent = 'Terjadi kesalahan. Silakan coba lagi.';
                loginError.style.display = 'block';
            });
        });

        window.openLoginModal = function() {
            document.getElementById('loginModal').classList.add('active');
            setTimeout(() => document.getElementById('username').focus(), 300);
            loginError.style.display = 'none';
        };
        
        window.closeModal = function() {
            document.getElementById('loginModal').classList.remove('active');
            loginForm.reset();
            loginError.style.display = 'none';
        };
    });
</script>
